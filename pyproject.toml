[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-data-parser"
version = "0.1.0"
description = "Parse Apple Health exports and custom health data into reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy",
    "PySide6>=6.5",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.2"]

[project.scripts]
health-data-parser = "health_data_parser.cli.parse:main"
health-data-parser-reports = "health_data_parser.cli.diagnostic_reports:main"

[project.gui-scripts]
health-data-parser-gui = "health_data_parser.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run from a checkout without an install; with
# `pip install -e .` this resolves to the same files
pythonpath = ["src"]
xfail_strict = true
# pytest-qt
qt_api = "pyside6"
